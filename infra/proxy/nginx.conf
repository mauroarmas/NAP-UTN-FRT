# Plantilla del proxy de producción. Sólo NAP_PUBLIC_HOST se sustituye.
map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
map $uri $cache_control {
    ~^/assets/ 'public, max-age=31536000, immutable';
    ~^/api/ no-store;
    default no-cache;
}
log_format sin_parametros '$remote_addr $request_method $uri $status $body_bytes_sent';
error_log /dev/stderr crit;
server_tokens off;
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    access_log /dev/stdout sin_parametros;
    listen 8080 default_server;
    server_name _;
    return 444;
}
server {
    access_log /dev/stdout sin_parametros;
    listen 8080;
    server_name ${NAP_PUBLIC_HOST};
    return 308 https://${NAP_PUBLIC_HOST}$request_uri;
}
server {
    access_log /dev/stdout sin_parametros;
    listen 8443 ssl;
    server_name ${NAP_PUBLIC_HOST};
    if ($host != '${NAP_PUBLIC_HOST}') { return 444; }
    ssl_certificate /run/tls/fullchain.pem;
    ssl_certificate_key /run/tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    ssl_session_cache shared:TLS:10m;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 1m;

    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Cache-Control $cache_control always;

    location /api/ {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /assets/ {
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
