services:
  db:
    image: postgres:16-alpine
    container_name: ps_postgres
    environment:
      POSTGRES_USER: ps_user
      POSTGRES_PASSWORD: ps_password
      POSTGRES_DB: ps_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps_user -d ps_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: ps_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ps_backend
    ports:
      - "8001:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ps_user:ps_password@db:5432/ps_db
      PROXMOX_HOST: ${PROXMOX_HOST:-172.16.36.100}
      PROXMOX_PORT: 8006
      PROXMOX_USER: root@pam
      PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME:-ps-dev}
      PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE:-}
      PROXMOX_VERIFY_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      CSRF_SECRET: ${CSRF_SECRET:-}
      SECRET_KEYRING: ${SECRET_KEYRING:?Configurar SECRET_KEYRING en .env antes de iniciar el portal}
      SECRET_ACTIVE_KEY: ${SECRET_ACTIVE_KEY:-}
      APP_FRONTEND_URL: http://localhost:5174
      APP_ENV: development
      APP_DEBUG: "true"
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@frt.utn.edu.ar}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_SSL: ${SMTP_SSL:-false}
    depends_on:
      db:
        condition: service_healthy
      mailpit:
        condition: service_started
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
      target: dev
    container_name: ps_frontend
    ports:
      - "5174:5173"
    environment:
      NAP_BACKEND_PROXY: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
