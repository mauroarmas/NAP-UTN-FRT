services:
  db:
    image: postgres:16-alpine
    container_name: ps_postgres
    environment:
      POSTGRES_USER: ps_user
      POSTGRES_PASSWORD: ps_password
      POSTGRES_DB: ps_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ps_user -d ps_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: dockerfile
    container_name: ps_backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://ps_user:ps_password@db:5432/ps_db
      PROXMOX_HOST: ${PROXMOX_HOST:-192.168.1.92}
      PROXMOX_PORT: 8006
      PROXMOX_USER: root@pam
      PROXMOX_TOKEN_NAME: ${PROXMOX_TOKEN_NAME:-ps-dev}
      PROXMOX_TOKEN_VALUE: ${PROXMOX_TOKEN_VALUE:-}
      PROXMOX_VERIFY_SSL: "false"
      SECRET_KEY: ${SECRET_KEY:-dev-secret-key-change-in-production}
      APP_ENV: development
      APP_DEBUG: "true"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend.dockerfile
    container_name: ps_frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
